services:

  wordpress:
    image: wordpress:php8.2-apache
    ports:
      - "8080:80"
    environment:
      WORDPRESS_DB_HOST: db
      WORDPRESS_DB_NAME: ${WORDPRESS_DB_NAME:-usjcf_local}
      WORDPRESS_DB_USER: ${WORDPRESS_DB_USER:-usjcf}
      WORDPRESS_DB_PASSWORD: ${WORDPRESS_DB_PASSWORD:-usjcf_local}
      WORDPRESS_TABLE_PREFIX: wpcp_
      WORDPRESS_CONFIG_EXTRA: |
        define('WP_HOME', 'http://localhost:8080');
        define('WP_SITEURL', 'http://localhost:8080');
        define('DISABLE_WP_CRON', true);
    volumes:
      - wordpress_core:/var/www/html
      - ./wp-content/themes:/var/www/html/wp-content/themes
      - ./wp-content/plugins:/var/www/html/wp-content/plugins
      - ./wp-content/uploads:/var/www/html/wp-content/uploads
      - ./docker/php-local.ini:/usr/local/etc/php/conf.d/php-local.ini
    depends_on:
      - db

  db:
    image: mariadb:10.11
    environment:
      MYSQL_DATABASE: ${WORDPRESS_DB_NAME:-usjcf_local}
      MYSQL_USER: ${WORDPRESS_DB_USER:-usjcf}
      MYSQL_PASSWORD: ${WORDPRESS_DB_PASSWORD:-usjcf_local}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-localrootpass}
    volumes:
      - db_data:/var/lib/mysql

  phpmyadmin:
    image: phpmyadmin:latest
    ports:
      - "8081:80"
    environment:
      PMA_HOST: db
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-localrootpass}
    depends_on:
      - db

  wpcli:
    image: wordpress:cli-php8.2
    volumes:
      - wordpress_core:/var/www/html
      - ./wp-content/themes:/var/www/html/wp-content/themes
      - ./wp-content/plugins:/var/www/html/wp-content/plugins
      - ./wp-content/uploads:/var/www/html/wp-content/uploads
    environment:
      WORDPRESS_DB_HOST: db
      WORDPRESS_DB_NAME: ${WORDPRESS_DB_NAME:-usjcf_local}
      WORDPRESS_DB_USER: ${WORDPRESS_DB_USER:-usjcf}
      WORDPRESS_DB_PASSWORD: ${WORDPRESS_DB_PASSWORD:-usjcf_local}
      WORDPRESS_TABLE_PREFIX: wpcp_
    depends_on:
      - db
    profiles:
      - tools

volumes:
  wordpress_core:
  db_data:
